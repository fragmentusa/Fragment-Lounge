<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Lucky Lounge</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  html, body {
    margin: 0;
    padding: 0;
    height: 100%;
    background: #04140e;
    overscroll-behavior: none;
  }

  #app-root {
    --felt-dark: #0b3d2e;
    --felt-mid: #124a37;
    --felt-light: #17603f;
    --burgundy: #5c1a26;
    --burgundy-bright: #7e2436;
    --gold: #d4af37;
    --gold-bright: #f4d35e;
    --cream: #f3ead9;
    --cream-dim: #cbbfa4;
    --shadow: #04140e;
    --win: #6fbf73;
    --lose: #c96b6b;

    font-family: 'Cutive Mono', 'IBM Plex Mono', monospace;
    color: var(--cream);
    background:
      radial-gradient(ellipse at top, var(--felt-light) 0%, var(--felt-dark) 55%, var(--shadow) 100%);
    height: 100dvh;
    height: 100vh;
    width: 100%;
    max-width: 480px;
    margin: 0 auto;
    display: flex;
    flex-direction: column;
    position: relative;
    overflow: hidden;
    box-shadow: 0 0 60px rgba(0,0,0,0.5) inset;
  }

  @import url('https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;900&family=IBM+Plex+Mono:wght@400;500;600;700&display=swap');

  #app-root * { box-sizing: border-box; }

  #app-root .felt-texture {
    position: absolute;
    inset: 0;
    pointer-events: none;
    background-image:
      radial-gradient(circle at 20% 10%, rgba(255,255,255,0.03) 0, transparent 40%),
      radial-gradient(circle at 80% 80%, rgba(255,255,255,0.025) 0, transparent 45%);
    mix-blend-mode: overlay;
  }

  /* ---------- Header / marquee ---------- */
  #app-root .marquee {
    position: relative;
    padding: 18px 16px 14px;
    border-bottom: 2px solid var(--gold);
    background: linear-gradient(180deg, rgba(0,0,0,0.25), transparent);
    text-align: center;
  }

  #app-root .bulbs {
    position: absolute;
    top: 6px; left: 8px; right: 8px;
    display: flex;
    justify-content: space-between;
  }
  #app-root .bulbs span {
    width: 5px; height: 5px;
    border-radius: 50%;
    background: var(--gold-bright);
    box-shadow: 0 0 4px 1px var(--gold-bright);
    animation: blink 1.6s infinite ease-in-out;
  }
  #app-root .bulbs span:nth-child(odd) { animation-delay: 0.4s; }
  #app-root .bulbs span:nth-child(3n) { animation-delay: 0.8s; }
  @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0.15; } }

  #app-root .logo {
    font-family: 'Playfair Display', serif;
    font-weight: 900;
    font-size: 26px;
    letter-spacing: 1px;
    margin: 10px 0 2px;
    color: var(--gold-bright);
    text-shadow: 0 0 12px rgba(244,211,94,0.35), 0 2px 0 rgba(0,0,0,0.4);
  }
  #app-root .tagline {
    font-size: 10px;
    letter-spacing: 3px;
    color: var(--cream-dim);
    text-transform: uppercase;
    margin-bottom: 12px;
  }

  #app-root .balance-strip {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    background: var(--shadow);
    border: 1px solid rgba(212,175,55,0.4);
    border-radius: 8px;
    padding: 8px 14px;
    margin: 0 auto;
    width: fit-content;
  }
  #app-root .balance-label {
    font-size: 10px;
    letter-spacing: 2px;
    color: var(--cream-dim);
    text-transform: uppercase;
  }
  #app-root .odometer {
    display: flex;
    font-family: 'IBM Plex Mono', monospace;
    font-weight: 700;
    font-size: 20px;
    font-variant-numeric: tabular-nums;
    color: var(--gold-bright);
    letter-spacing: 1px;
  }
  #app-root .odometer .digit {
    display: inline-block;
    width: 13px;
    text-align: center;
    transition: transform 0.25s ease;
  }
  #app-root .odometer .digit.rolling { animation: roll 0.3s ease; }
  @keyframes roll { 0% { transform: translateY(-6px); opacity: 0.3; } 100% { transform: translateY(0); opacity: 1; } }

  #app-root .bonus-row {
    display: flex;
    justify-content: center;
    margin-top: 10px;
  }
  #app-root .bonus-btn {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 11px;
    letter-spacing: 1px;
    background: linear-gradient(180deg, var(--gold-bright), var(--gold));
    color: var(--shadow);
    border: none;
    border-radius: 20px;
    padding: 6px 16px;
    font-weight: 700;
    cursor: pointer;
    text-transform: uppercase;
    box-shadow: 0 2px 0 #8a6d1f;
    transition: transform 0.1s ease;
  }
  #app-root .bonus-btn:active { transform: translateY(2px); box-shadow: none; }
  #app-root .bonus-btn:disabled {
    background: #444;
    color: #999;
    box-shadow: none;
    cursor: default;
  }

  /* ---------- Game area ---------- */
  #app-root .stage {
    flex: 1;
    padding: 20px 16px 10px;
    display: flex;
    flex-direction: column;
    align-items: center;
    min-height: 300px;
  }

  #app-root .game-title {
    font-family: 'Playfair Display', serif;
    font-size: 17px;
    color: var(--gold-bright);
    margin-bottom: 4px;
  }
  #app-root .game-sub {
    font-size: 10.5px;
    color: var(--cream-dim);
    margin-bottom: 16px;
    text-align: center;
    line-height: 1.5;
  }

  /* Slots */
  #app-root .reels {
    display: flex;
    gap: 8px;
    background: var(--shadow);
    border: 3px solid var(--gold);
    border-radius: 10px;
    padding: 14px 12px;
    box-shadow: 0 6px 18px rgba(0,0,0,0.5), inset 0 0 20px rgba(0,0,0,0.6);
  }
  #app-root .reel {
    width: 56px;
    height: 64px;
    background: linear-gradient(180deg, #1a1a1a, #0a0a0a);
    border-radius: 6px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 30px;
    overflow: hidden;
    border: 1px solid rgba(212,175,55,0.3);
  }
  #app-root .reel span { display: inline-block; }
  #app-root .reel.spinning span { animation: spin-symbol 0.12s linear infinite; }
  @keyframes spin-symbol { 0% { transform: translateY(-20px); } 100% { transform: translateY(20px); } }

  #app-root .paytable {
    margin-top: 14px;
    font-size: 10px;
    color: var(--cream-dim);
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 4px 10px;
    text-align: left;
  }
  #app-root .paytable div span:first-child { margin-right: 4px; }
  #app-root .paytable div span:last-child { color: var(--gold); }

  /* Dice */
  #app-root .dice-row { display: flex; gap: 18px; margin-bottom: 10px; }
  #app-root .die {
    width: 54px; height: 54px;
    background: var(--cream);
    border-radius: 10px;
    display: flex; align-items: center; justify-content: center;
    font-size: 26px; font-weight: 700; color: var(--shadow);
    box-shadow: 0 4px 10px rgba(0,0,0,0.4);
  }
  #app-root .die.rolling { animation: shake 0.1s linear infinite; }
  @keyframes shake { 0% { transform: rotate(-8deg); } 50% { transform: rotate(8deg); } 100% { transform: rotate(-8deg); } }
  #app-root .dice-total {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 13px;
    color: var(--gold-bright);
    margin-bottom: 14px;
  }
  #app-root .pick-row { display: flex; gap: 8px; margin-bottom: 14px; }

  /* Coin */
  #app-root .coin {
    width: 90px; height: 90px;
    border-radius: 50%;
    background: radial-gradient(circle at 35% 30%, var(--gold-bright), var(--gold) 60%, #8a6d1f 100%);
    display: flex; align-items: center; justify-content: center;
    font-family: 'Playfair Display', serif;
    font-weight: 900;
    font-size: 15px;
    color: var(--shadow);
    box-shadow: 0 6px 16px rgba(0,0,0,0.5);
    margin-bottom: 16px;
    border: 2px solid #8a6d1f;
  }
  #app-root .coin.flipping { animation: flip 0.15s linear infinite; }
  @keyframes flip { 0% { transform: rotateY(0deg) scale(1); } 50% { transform: rotateY(180deg) scale(0.85); } 100% { transform: rotateY(360deg) scale(1); } }

  /* Shared controls */
  #app-root .choice-btn {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 11px;
    letter-spacing: 0.5px;
    background: transparent;
    border: 1.5px solid var(--cream-dim);
    color: var(--cream);
    border-radius: 6px;
    padding: 8px 14px;
    cursor: pointer;
    text-transform: uppercase;
    transition: all 0.15s ease;
  }
  #app-root .choice-btn.active {
    border-color: var(--gold);
    background: rgba(212,175,55,0.15);
    color: var(--gold-bright);
  }

  #app-root .bet-row {
    display: flex;
    align-items: center;
    gap: 10px;
    margin: 18px 0 8px;
  }
  #app-root .bet-btn {
    width: 30px; height: 30px;
    border-radius: 50%;
    border: 1px solid var(--gold);
    background: transparent;
    color: var(--gold-bright);
    font-size: 16px;
    cursor: pointer;
    display: flex; align-items: center; justify-content: center;
  }
  #app-root .bet-btn:active { background: rgba(212,175,55,0.2); }
  #app-root .bet-amount {
    font-family: 'IBM Plex Mono', monospace;
    font-weight: 700;
    font-size: 16px;
    color: var(--cream);
    min-width: 70px;
    text-align: center;
  }

  #app-root .spin-btn {
    font-family: 'Playfair Display', serif;
    font-weight: 900;
    font-size: 15px;
    letter-spacing: 1px;
    background: linear-gradient(180deg, var(--burgundy-bright), var(--burgundy));
    color: var(--cream);
    border: 1.5px solid var(--gold);
    border-radius: 24px;
    padding: 10px 34px;
    cursor: pointer;
    text-transform: uppercase;
    box-shadow: 0 3px 0 #3a1017, 0 6px 14px rgba(0,0,0,0.4);
    transition: transform 0.1s ease;
  }
  #app-root .spin-btn:active { transform: translateY(3px); box-shadow: 0 0 0 #3a1017; }
  #app-root .spin-btn:disabled { opacity: 0.5; cursor: default; }

  #app-root .result-msg {
    margin-top: 14px;
    min-height: 20px;
    font-size: 13px;
    font-weight: 700;
    letter-spacing: 0.5px;
  }
  #app-root .result-msg.win { color: var(--win); }
  #app-root .result-msg.lose { color: var(--lose); }

  #app-root .broke-msg {
    margin-top: 14px;
    font-size: 11px;
    color: var(--cream-dim);
    text-align: center;
    line-height: 1.6;
  }

  /* ---------- Tab bar ---------- */
  #app-root .tabbar {
    display: flex;
    border-top: 1px solid rgba(212,175,55,0.35);
    background: var(--shadow);
  }
  #app-root .tab {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 3px;
    padding: 10px 0 8px;
    background: none;
    border: none;
    color: var(--cream-dim);
    font-family: 'IBM Plex Mono', monospace;
    font-size: 9.5px;
    letter-spacing: 0.5px;
    text-transform: uppercase;
    cursor: pointer;
  }
  #app-root .tab .icon { font-size: 18px; filter: grayscale(1); opacity: 0.6; }
  #app-root .tab.active { color: var(--gold-bright); }
  #app-root .tab.active .icon { filter: none; opacity: 1; }

  #app-root .loading-screen {
    display: flex; align-items: center; justify-content: center;
    min-height: 100vh; font-size: 12px; color: var(--cream-dim);
  }

  #app-root .toast {
    position: absolute;
    top: 10px; left: 50%;
    transform: translateX(-50%);
    background: var(--gold-bright);
    color: var(--shadow);
    font-size: 11px;
    font-weight: 700;
    padding: 6px 14px;
    border-radius: 16px;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.3s ease, top 0.3s ease;
    z-index: 10;
    white-space: nowrap;
  }
  #app-root .toast.show { opacity: 1; top: 16px; }
</style>
</head>
<body>
<div id="app-root"></div>

<script>
(function () {
  // --- Telegram WebApp integration: go full screen, match native chrome ---
  const tg = window.Telegram && window.Telegram.WebApp;
  if (tg) {
    tg.ready();
    tg.expand();
    if (tg.requestFullscreen) { try { tg.requestFullscreen(); } catch (e) {} }
    tg.disableVerticalSwipes && tg.disableVerticalSwipes();
    try {
      tg.setHeaderColor && tg.setHeaderColor('#0b3d2e');
      tg.setBackgroundColor && tg.setBackgroundColor('#04140e');
    } catch (e) {}
  }

  function syncViewportHeight() {
    const root = document.getElementById('app-root');
    if (!root) return;
    const h = (tg && tg.viewportStableHeight) ? tg.viewportStableHeight : window.innerHeight;
    root.style.height = h + 'px';
  }
  if (tg) {
    tg.onEvent && tg.onEvent('viewportChanged', syncViewportHeight);
  }
  window.addEventListener('resize', syncViewportHeight);

  const root = document.getElementById('app-root');

  const STARTING_BALANCE = 1000;
  const BONUS_AMOUNT = 200;
  const BONUS_COOLDOWN_MS = 24 * 60 * 60 * 1000;

  let state = {
    balance: STARTING_BALANCE,
    lastBonus: 0,
    tab: 'slots',
    bet: 20,
    busy: false,
  };

  function fmt(n) {
    return Math.max(0, Math.floor(n)).toString().padStart(5, '0');
  }

  async function loadState() {
    try {
      const res = await window.storage.get('lucky-lounge-state', false);
      if (res && res.value) {
        const saved = JSON.parse(res.value);
        state.balance = typeof saved.balance === 'number' ? saved.balance : STARTING_BALANCE;
        state.lastBonus = saved.lastBonus || 0;
      }
    } catch (e) {
      // no saved state yet, use defaults
    }
  }

  async function saveState() {
    try {
      await window.storage.set('lucky-lounge-state', JSON.stringify({
        balance: state.balance,
        lastBonus: state.lastBonus,
      }), false);
    } catch (e) {
      console.error('save failed', e);
    }
  }

  function showToast(msg) {
    const t = root.querySelector('.toast');
    if (!t) return;
    t.textContent = msg;
    t.classList.add('show');
    setTimeout(() => t.classList.remove('show'), 1800);
  }

  function renderOdometer(val) {
    return fmt(val).split('').map(d => `<span class="digit">${d}</span>`).join('');
  }

  function bumpOdometer() {
    root.querySelectorAll('.digit').forEach(d => {
      d.classList.remove('rolling');
      void d.offsetWidth;
      d.classList.add('rolling');
    });
  }

  function canClaimBonus() {
    return Date.now() - state.lastBonus >= BONUS_COOLDOWN_MS;
  }

  function claimBonus() {
    if (!canClaimBonus() || state.busy) return;
    state.balance += BONUS_AMOUNT;
    state.lastBonus = Date.now();
    saveState();
    showToast(`+${BONUS_AMOUNT} daily bonus`);
    render();
  }

  function adjustBet(delta) {
    if (state.busy) return;
    state.bet = Math.max(10, Math.min(500, state.bet + delta));
    render();
  }

  function switchTab(tab) {
    if (state.busy) return;
    state.tab = tab;
    render();
  }

  // ---------- Slots ----------
  const SLOT_SYMBOLS = [
    { icon: '🍋', weight: 30, mult: 2 },
    { icon: '🍒', weight: 24, mult: 3 },
    { icon: '🔔', weight: 16, mult: 5 },
    { icon: '⭐', weight: 10, mult: 8 },
    { icon: '💎', weight: 6,  mult: 15 },
    { icon: '7️⃣', weight: 2,  mult: 50 },
  ];
  function weightedSymbol() {
    const total = SLOT_SYMBOLS.reduce((s, x) => s + x.weight, 0);
    let r = Math.random() * total;
    for (const s of SLOT_SYMBOLS) {
      if (r < s.weight) return s;
      r -= s.weight;
    }
    return SLOT_SYMBOLS[0];
  }

  let slotResult = null;

  function spinSlots() {
    if (state.busy || state.balance < state.bet) return;
    state.busy = true;
    state.balance -= state.bet;
    slotResult = null;
    render();

    const reels = root.querySelectorAll('.reel');
    reels.forEach(r => r.classList.add('spinning'));

    const finals = [weightedSymbol(), weightedSymbol(), weightedSymbol()];
    const delays = [700, 1000, 1300];

    finals.forEach((sym, i) => {
      setTimeout(() => {
        const reel = reels[i];
        if (!reel) return;
        reel.classList.remove('spinning');
        reel.querySelector('span').textContent = sym.icon;
      }, delays[i]);
    });

    setTimeout(() => {
      const [a, b, c] = finals;
      let winnings = 0;
      if (a.icon === b.icon && b.icon === c.icon) {
        winnings = state.bet * a.mult;
      }
      state.balance += winnings;
      slotResult = { win: winnings > 0, amount: winnings, symbols: finals.map(f => f.icon) };
      state.busy = false;
      saveState();
      render();
    }, 1500);
  }

  // ---------- Dice ----------
  let dicePick = 'under';
  let diceResult = null;

  function rollDice() {
    if (state.busy || state.balance < state.bet) return;
    state.busy = true;
    state.balance -= state.bet;
    diceResult = null;
    render();

    const dice = root.querySelectorAll('.die');
    dice.forEach(d => d.classList.add('rolling'));

    setTimeout(() => {
      const d1 = 1 + Math.floor(Math.random() * 6);
      const d2 = 1 + Math.floor(Math.random() * 6);
      const total = d1 + d2;
      let win = false;
      let mult = 0;
      if (dicePick === 'under' && total < 7) { win = true; mult = 1.9; }
      if (dicePick === 'over' && total > 7) { win = true; mult = 1.9; }
      if (dicePick === 'seven' && total === 7) { win = true; mult = 5; }

      const winnings = win ? Math.round(state.bet * mult) : 0;
      state.balance += winnings;
      diceResult = { d1, d2, total, win, amount: winnings };
      state.busy = false;
      saveState();
      render();
    }, 900);
  }

  // ---------- Coinflip ----------
  let coinPick = 'heads';
  let coinResult = null;

  function flipCoin() {
    if (state.busy || state.balance < state.bet) return;
    state.busy = true;
    state.balance -= state.bet;
    coinResult = null;
    render();

    const coin = root.querySelector('.coin');
    if (coin) coin.classList.add('flipping');

    setTimeout(() => {
      const outcome = Math.random() < 0.5 ? 'heads' : 'tails';
      const win = outcome === coinPick;
      const winnings = win ? Math.round(state.bet * 1.9) : 0;
      state.balance += winnings;
      coinResult = { outcome, win, amount: winnings };
      state.busy = false;
      saveState();
      render();
    }, 1000);
  }

  // ---------- Render ----------
  function renderStage() {
    const brokeMsg = state.balance < state.bet
      ? `<div class="broke-msg">Not enough chips for this bet.<br>Lower your bet or wait for tomorrow's bonus.</div>`
      : '';

    if (state.tab === 'slots') {
      const r = slotResult;
      return `
        <div class="game-title">Three of a Kind</div>
        <div class="game-sub">Match all three reels to win.<br>Purely for fun — house chips only, no cash value.</div>
        <div class="reels">
          <div class="reel"><span>${r ? r.symbols[0] : '🍋'}</span></div>
          <div class="reel"><span>${r ? r.symbols[1] : '🍒'}</span></div>
          <div class="reel"><span>${r ? r.symbols[2] : '🔔'}</span></div>
        </div>
        <div class="paytable">
          ${SLOT_SYMBOLS.map(s => `<div><span>${s.icon}</span><span>×${s.mult}</span></div>`).join('')}
        </div>
        ${betControls()}
        <button class="spin-btn" id="action-btn" ${state.busy || state.balance < state.bet ? 'disabled' : ''}>Spin</button>
        ${r ? `<div class="result-msg ${r.win ? 'win' : 'lose'}">${r.win ? `You won ${r.amount} chips!` : 'No match — try again'}</div>` : '<div class="result-msg"></div>'}
        ${brokeMsg}
      `;
    }

    if (state.tab === 'dice') {
      const r = diceResult;
      return `
        <div class="game-title">Roll the Dice</div>
        <div class="game-sub">Two dice, pick your side.<br>Under 7 or Over 7 pays ×1.9 · Exactly 7 pays ×5</div>
        <div class="dice-row">
          <div class="die">${r ? r.d1 : '?'}</div>
          <div class="die">${r ? r.d2 : '?'}</div>
        </div>
        <div class="dice-total">${r ? `Total: ${r.total}` : '&nbsp;'}</div>
        <div class="pick-row">
          <button class="choice-btn ${dicePick === 'under' ? 'active' : ''}" data-pick="under">Under 7</button>
          <button class="choice-btn ${dicePick === 'seven' ? 'active' : ''}" data-pick="seven">Exactly 7</button>
          <button class="choice-btn ${dicePick === 'over' ? 'active' : ''}" data-pick="over">Over 7</button>
        </div>
        ${betControls()}
        <button class="spin-btn" id="action-btn" ${state.busy || state.balance < state.bet ? 'disabled' : ''}>Roll</button>
        ${r ? `<div class="result-msg ${r.win ? 'win' : 'lose'}">${r.win ? `You won ${r.amount} chips!` : 'No luck this time'}</div>` : '<div class="result-msg"></div>'}
        ${brokeMsg}
      `;
    }

    // coinflip
    const r = coinResult;
    return `
      <div class="game-title">Coin Flip</div>
      <div class="game-sub">Call it in the air.<br>Correct call pays ×1.9</div>
      <div class="coin">${r ? (r.outcome === 'heads' ? 'H' : 'T') : '?'}</div>
      <div class="pick-row">
        <button class="choice-btn ${coinPick === 'heads' ? 'active' : ''}" data-pick="heads">Heads</button>
        <button class="choice-btn ${coinPick === 'tails' ? 'active' : ''}" data-pick="tails">Tails</button>
      </div>
      ${betControls()}
      <button class="spin-btn" id="action-btn" ${state.busy || state.balance < state.bet ? 'disabled' : ''}>Flip</button>
      ${r ? `<div class="result-msg ${r.win ? 'win' : 'lose'}">${r.win ? `You won ${r.amount} chips!` : `Landed on ${r.outcome} — no luck`}</div>` : '<div class="result-msg"></div>'}
      ${brokeMsg}
    `;
  }

  function betControls() {
    return `
      <div class="bet-row">
        <button class="bet-btn" id="bet-minus">−</button>
        <div class="bet-amount">${state.bet} chips</div>
        <button class="bet-btn" id="bet-plus">+</button>
      </div>
    `;
  }

  function render() {
    const bonusReady = canClaimBonus();
    root.innerHTML = `
      <div class="felt-texture"></div>
      <div class="toast"></div>
      <div class="marquee">
        <div class="bulbs">${Array.from({length: 14}).map(() => '<span></span>').join('')}</div>
        <div class="logo">♠ Lucky Lounge ♦</div>
        <div class="tagline">Play money only · No purchases, no payouts</div>
        <div class="balance-strip">
          <span class="balance-label">Chips</span>
          <span class="odometer">${renderOdometer(state.balance)}</span>
        </div>
        <div class="bonus-row">
          <button class="bonus-btn" id="bonus-btn" ${bonusReady ? '' : 'disabled'}>
            ${bonusReady ? `Claim daily +${BONUS_AMOUNT}` : 'Bonus claimed today'}
          </button>
        </div>
      </div>
      <div class="stage">${renderStage()}</div>
      <div class="tabbar">
        <button class="tab ${state.tab === 'slots' ? 'active' : ''}" data-tab="slots"><span class="icon">🎰</span>Slots</button>
        <button class="tab ${state.tab === 'dice' ? 'active' : ''}" data-tab="dice"><span class="icon">🎲</span>Dice</button>
        <button class="tab ${state.tab === 'coin' ? 'active' : ''}" data-tab="coin"><span class="icon">🪙</span>Coin</button>
      </div>
    `;
    bumpOdometer();
    attachHandlers();
  }

  function attachHandlers() {
    const bonusBtn = root.querySelector('#bonus-btn');
    if (bonusBtn) bonusBtn.addEventListener('click', claimBonus);

    root.querySelectorAll('.tab').forEach(t => {
      t.addEventListener('click', () => switchTab(t.dataset.tab));
    });

    const betMinus = root.querySelector('#bet-minus');
    const betPlus = root.querySelector('#bet-plus');
    if (betMinus) betMinus.addEventListener('click', () => adjustBet(-10));
    if (betPlus) betPlus.addEventListener('click', () => adjustBet(10));

    root.querySelectorAll('[data-pick]').forEach(btn => {
      btn.addEventListener('click', () => {
        if (state.busy) return;
        if (state.tab === 'dice') dicePick = btn.dataset.pick;
        if (state.tab === 'coin') coinPick = btn.dataset.pick;
        render();
      });
    });

    const actionBtn = root.querySelector('#action-btn');
    if (actionBtn) {
      actionBtn.addEventListener('click', () => {
        if (state.tab === 'slots') spinSlots();
        if (state.tab === 'dice') rollDice();
        if (state.tab === 'coin') flipCoin();
      });
    }
  }

  async function init() {
    root.innerHTML = '<div class="loading-screen">Shuffling the deck…</div>';
    syncViewportHeight();
    await loadState();
    render();
    syncViewportHeight();
  }

  init();
})();
</script>
</body>
</html>
