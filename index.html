  function rocketCardArt() {
    return `
      <svg viewBox="0 0 160 150" preserveAspectRatio="xMidYMid slice" style="width:100%; height:100%;">
        <defs>
          <linearGradient id="card-ship-grad" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0%" stop-color="#f4d35e"/>
            <stop offset="100%" stop-color="#c98f2f"/>
          </linearGradient>
          <linearGradient id="card-flame-grad" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0%" stop-color="#fff3d6"/>
            <stop offset="45%" stop-color="#f0a35f"/>
            <stop offset="100%" stop-color="#d9705f" stop-opacity="0"/>

          <linearGradient id="card-trail-grad" x1="0" y1="1" x2="1" y2="0">
            <stop offset="0%" stop-color="#d9705f" stop-opacity="0.05"/>
            <stop offset="100%" stop-color="#f0c25f" stop-opacity="0.4"/>
          </linearGradient>
        </defs>
        <circle cx="30" cy="24" r="1.1" fill="rgba(255,255,255,0.5)"></circle>
        <circle cx="70" cy="14" r="0.8" fill="rgba(255,255,255,0.4)"></circle>
        <circle cx="118" cy="30" r="1.3" fill="rgba(255,255,255,0.5)"></circle>
        <circle cx="95" cy="55" r="0.8" fill="rgba(255,255,255,0.35)"></circle>
        <path d="M 6 140 C 40 130 70 95 130 40" fill="none" stroke="#f0c25f" stroke-width="2.5" stroke-linecap="round" opacity="0.9"></path>
        <path d="M 6 140 C 40 130 70 95 130 40 L 130 150 L 6 150 Z" fill="url(#card-trail-grad)"></path>
        <g transform="translate(130,40) rotate(-42)">
          <g class="flame">
            <path d="M -2.6 9 C -2.6 13 -1 18 0 21 C 1 18 2.6 13 2.6 9 Z" fill="url(#card-flame-grad)"></path>
          </g>
          <path d="M -4.3 7 L -4.3 -2 C -4.3 -7 -3 -10 0 -14 C 3 -10 4.3 -7 4.3 -2 L 4.3 7 Q 4.3 9.5 1.6 9.5 L -1.6 9.5 Q -4.3 9.5 -4.3 7 Z"
                fill="url(#card-ship-grad)" stroke="#8a6b2c" stroke-width="0.5"></path>
          <polygon points="-4.3,4 -10,10.5 -4.8,11.5" fill="#7e2436"></polygon>
          <polygon points="4.3,4 10,10.5 4.8,11.5" fill="#7e2436"></polygon>
          <circle cx="0" cy="-3.5" r="2" fill="#8fd8ef"></circle>
        </g>
      </svg>
    `;
  }

  function renderGamesHome() {
    return `
      <div class="live-status"><span class="live-dot"></span>сейчас играют: ${33 + (state.stats.totalSpins % 7)}</div>
      ${renderRaceCard()}
      <button class="bonus-btn" id="bonus-btn" ${canClaimBonus() ? '' : 'disabled'}>
        ${canClaimBonus() ? `Забрать дневной бонус +${BONUS_AMOUNT}` : 'Бонус уже получен сегодня'}
      </button>
      <div class="pill-row">
        <div class="cat-pill active">Live-игры</div>
        <div class="cat-pill">Скоро</div>
      </div>
      <div class="section-label"><span>Live-игры</span><span>для вас</span></div>
      <div class="game-grid">
        <div class="game-card" data-game="slots">
          <div class="art art-slots"></div>
          <div class="scrim"></div>
          <div class="live-badge"><span class="dot"></span>LIVE</div>
          <div class="info">
            <div class="g-title">🎰 Слоты</div>
            <div class="g-sub">Три одинаковых — выигрыш</div>
          </div>
        </div>
        <div class="game-card" data-game="dice">
          <div class="art art-dice"></div>
          <div class="scrim"></div>
          <div class="live-badge"><span class="dot"></span>LIVE</div>
          <div class="info">
            <div class="g-title">🎲 Кости</div>
            <div class="g-sub">Больше, меньше или ровно 7</div>
          </div>
        </div>
        <div class="game-card" data-game="coin">
          <div class="art art-coin"></div>
          <div class="scrim"></div>
          <div class="live-badge"><span class="dot"></span>LIVE</div>
          <div class="info">
            <div class="g-title">🪙 Монетка</div>
            <div class="g-sub">Орёл или решка</div>
          </div>
        </div>
        <div class="game-card" data-game="rocket">
          <div class="art art-soon1">${rocketCardArt()}</div>
          <div class="scrim"></div>
          <div class="live-badge"><span class="dot"></span>LIVE</div>
          <div class="info">
            <div class="g-title">🚀 Ракета</div>
            <div class="g-sub">Заберите до взрыва</div>
          </div>
        </div>
        <div class="game-card disabled">
          <div class="art art-soon2"></div>
          <div class="scrim"></div>
          <div class="soon-badge">СКОРО</div>
          <div class="info">
            <div class="g-title">🎡 Рулетка</div>
            <div class="g-sub">В разработке</div>
          </div>
        </div>
      </div>
    `;
  }

  function betControls() {
    return `
      <div class="bet-row">
        <button class="bet-btn" id="bet-minus">−</button>
        <div class="bet-amount">${state.bet} фишек</div>
        <button class="bet-btn" id="bet-plus">+</button>
      </div>
    `;
  }

  function renderGameScreen(name) {
    const brokeMsg = state.balance < state.bet
      ? `<div class="broke-msg">Недостаточно фишек для этой ставки.<br>Снизьте ставку или дождитесь бонуса.</div>` : '';

    if (name === 'slots') {
      const r = slotResult;
      return `
        <div class="game-header"><button class="back-btn" id="back-btn">‹</button><div class="g-name">🎰 Слоты</div></div>
        <div class="stage">
          <div class="game-sub">Три одинаковых символа на линии — выигрыш.<br>Игра для развлечения, фишки не имеют реальной ценности.</div>
          <div class="reels">
            <div class="reel"><span>${r ? r.symbols[0] : '🍋'}</span></div>
            <div class="reel"><span>${r ? r.symbols[1] : '🍒'}</span></div>
            <div class="reel"><span>${r ? r.symbols[2] : '🔔'}</span></div>
          </div>
          <div class="paytable">${SLOT_SYMBOLS.map(s => `<div><span>${s.icon}</span> <span>×${s.mult}</span></div>`).join('')}</div>
          ${betControls()}
          <button class="spin-btn" id="action-btn" ${state.busy || state.balance < state.bet ? 'disabled' : ''}>Крутить</button>
          ${r ? `<div class="result-msg ${r.win ? 'win' : 'lose'}">${r.win ? `Выигрыш ${r.amount} фишек!` : 'Не повезло, попробуй ещё'}</div>` : '<div class="result-msg"></div>'}
          ${brokeMsg}
        </div>
      `;
    }
    if (name === 'dice') {
      const r = diceResult;
      return `
        <div class="game-header"><button class="back-btn" id="back-btn">‹</button><div class="g-name">🎲 Кости</div></div>
        <div class="stage">
          <div class="game-sub">Два кубика, выбери сторону.<br>Меньше/больше 7 — ×1.9 · Ровно 7 — ×5</div>
          <div class="dice-row"><div class="die">${r ? r.d1 : '?'}</div><div class="die">${r ? r.d2 : '?'}</div></div>
          <div class="dice-total">${r ? `Сумма: ${r.total}` : '&nbsp;'}</div>
          <div class="pick-row">
            <button class="choice-btn ${dicePick === 'under' ? 'active' : ''}" data-pick="under">Меньше 7</button>
            <button class="choice-btn ${dicePick === 'seven' ? 'active' : ''}" data-pick="seven">Ровно 7</button>
            <button class="choice-btn ${dicePick === 'over' ? 'active' : ''}" data-pick="over">Больше 7</button>
          </div>
          ${betControls()}
          <button class="spin-btn" id="action-btn" ${state.busy || state.balance < state.bet ? 'disabled' : ''}>Бросить</button>
          ${r ? `<div class="result-msg ${r.win ? 'win' : 'lose'}">${r.win ? `Выигрыш ${r.amount} фишек!` : 'Не в этот раз'}</div>` : '<div class="result-msg"></div>'}
          ${brokeMsg}
        </div>
      `;
    }
    if (name === 'rocket') return renderRocketScreen();

    // coin
    const r = coinResult;
    return `
      <div class="game-header"><button class="back-btn" id="back-btn">‹</button><div class="g-name">🪙 Монетка</div></div>
      <div class="stage">
        <div class="game-sub">Угадай сторону монеты.<br>Верный выбор — ×1.9</div>
        <div class="coin">${r ? (r.outcome === 'heads' ? 'О' : 'Р') : '?'}</div>
        <div class="pick-row">
          <button class="choice-btn ${coinPick === 'heads' ? 'active' : ''}" data-pick="heads">Орёл</button>
          <button class="choice-btn ${coinPick === 'tails' ? 'active' : ''}" data-pick="tails">Решка</button>
        </div>
        ${betControls()}
        <button class="spin-btn" id="action-btn" ${state.busy || state.balance < state.bet ? 'disabled' : ''}>Бросить</button>
        ${r ? `<div class="result-msg ${r.win ? 'win' : 'lose'}">${r.win ? `Выигрыш ${r.amount} фишек!` : `Выпало ${r.outcome === 'heads' ? 'орёл' : 'решка'} — мимо`}</div>` : '<div class="result-msg"></div>'}
        ${brokeMsg}
      </div>
    `;
  }

  function renderQuests() {
    return `
      <div class="section-label"><span>Задания</span><span>${state.claimedQuests.length}/${QUESTS.length}</span></div>
      ${QUESTS.map(q => {
        const prog = q.progress(state.stats);
        const done = state.claimedQuests.includes(q.id);
        const ready = !done && prog >= q.target;
        const pct = Math.min(100, Math.round((prog / q.target) * 100));
        let btn;
        if (done) btn = `<button class="quest-btn done" disabled>Готово</button>`;
        else if (ready) btn = `<button class="quest-btn claim" data-quest="${q.id}">+${q.reward}</button>`;
        else btn = `<button class="quest-btn locked" disabled>${prog}/${q.target}</button>`;
        return `
          <div class="quest-card">
            <div class="q-icon">${q.icon}</div>
            <div class="q-body">
              <div class="q-title">${q.title}</div>
              <div class="q-desc">${q.desc}</div>
              <div class="q-bar-track"><div class="q-bar-fill" style="width:${pct}%;"></div></div>
            </div>
            ${btn}
          </div>
        `;
      }).join('')}
    `;
  }

  function renderShop() {
    return `
      <div class="section-label"><span>Магазин</span><span>рамки профиля</span></div>
      <div class="shop-grid">
        ${FRAMES.map(f => {
          const owned = state.ownedFrames.includes(f.id);
          const equipped = state.equippedFrame === f.id;
          let btn;
          if (equipped) btn = `<button class="shop-btn equipped" disabled>Надето</button>`;
          else if (owned) btn = `<button class="shop-btn equip" data-frame="${f.id}">Надеть</button>`;
          else btn = `<button class="shop-btn buy" data-frame="${f.id}">${fmt(f.cost)} 🪙</button>`;
          return `
            <div class="shop-card">
              <div class="frame-preview">${frameRingSvg(f.ring)}</div>
              <div class="s-name">${f.name}</div>
              ${btn}
            </div>
          `;
        }).join('')}
      </div>
      <div class="rocket-note" style="margin-top:14px;">Фишки — виртуальная валюта только для развлечения, без реальной ценности и без возможности вывода.</div>
    `;
  }

  function renderFriends() {
    return `
      <div class="friend-card">
        <div class="f-big">🎁</div>
        <div class="f-title">Пригласи друзей</div>
        <div class="f-desc">Отправь другу ссылку на Fragment Lounge.<br>Это демо-режим — общий счёт друзей пока не считается.</div>
        <button class="invite-btn" id="invite-btn">Скопировать ссылку</button>
      </div>
      <div class="section-label"><span>Приглашённые</span><span>0</span></div>
      <div class="empty-note">Пока никто не присоединился по вашей ссылке</div>
    `;
  }

  function renderProfile() {
    const f = frameById(state.equippedFrame);
    const s = state.stats;
    const joinedDate = new Date(s.joined).toLocaleDateString('ru-RU');
    return `
      <div class="profile-head">
        <div class="avatar-wrap profile-avatar">
          <div class="avatar-photo">${avatarPhotoHtml()}</div>
          <div class="avatar-ring">${frameRingSvg(f.ring)}</div>
        </div>
        <div class="profile-name">${state.username}</div>
        <div class="profile-sub">В игре с ${joinedDate}</div>
      </div>
      <div class="stat-grid">
        <div class="stat-card"><div class="val">${fmt(state.balance)}</div><div class="lbl">Баланс</div></div>
        <div class="stat-card"><div class="val">${s.totalSpins}</div><div class="lbl">Ставок сделано</div></div>
        <div class="stat-card"><div class="val">${s.totalWins}</div><div class="lbl">Побед</div></div>
        <div class="stat-card"><div class="val">${fmt(s.maxBalance)}</div><div class="lbl">Рекорд баланса</div></div>
      </div>
      <button class="reset-btn" id="reset-btn">Сбросить прогресс</button>
    `;
  }

  function renderScrollContent() {
    if (state.navTab === 'games') {
      if (state.screen.startsWith('game:')) return renderGameScreen(state.screen.split(':')[1]);
      return renderGamesHome();
    }
    if (state.navTab === 'friends') return renderFriends();
    if (state.navTab === 'quests') return renderQuests();
    if (state.navTab === 'shop') return renderShop();
    return renderProfile();
  }

  function render() {
    root.innerHTML = `
      <div class="toast"></div>
      ${renderTopbar()}
      <div class="scroll"><div class="fade-in">${renderScrollContent()}</div></div>
      <div class="tabbar">
        <button class="tab ${state.navTab === 'games' ? 'active' : ''}" data-tab="games"><span class="icon">🎮</span>Игры</button>
        <button class="tab ${state.navTab === 'friends' ? 'active' : ''}" data-tab="friends"><span class="icon">👥</span>Друзья</button>
        <button class="tab ${state.navTab === 'quests' ? 'active' : ''}" data-tab="quests"><span class="icon">🎁</span>Задания</button>
        <button class="tab ${state.navTab === 'shop' ? 'active' : ''}" data-tab="shop"><span class="icon">🛍️</span>Магазин</button>
        <button class="tab ${state.navTab === 'profile' ? 'active' : ''}" data-tab="profile"><span class="icon">👤</span>Профиль</button>
      </div>
    `;
    attachHandlers();
  }

  let raceTimerInterval = null;
  function startRaceTimer() {
    if (raceTimerInterval) clearInterval(raceTimerInterval);
    raceTimerInterval = setInterval(() => {
      const el = root.querySelector('#race-timer');
      if (el) el.textContent = formatCountdown(msUntilMidnight());
    }, 1000);
  }

  function attachHandlers() {
    root.querySelectorAll('.tab').forEach(t => t.addEventListener('click', () => goNav(t.dataset.tab)));

    const bonusBtn = root.querySelector('#bonus-btn');
    if (bonusBtn) bonusBtn.addEventListener('click', claimBonus);

    root.querySelectorAll('.game-card[data-game]').forEach(c => {
      c.addEventListener('click', () => openGame(c.dataset.game));
    });

    const backBtn = root.querySelector('#back-btn');
    if (backBtn) backBtn.addEventListener('click', closeGame);

    const betMinus = root.querySelector('#bet-minus');
    const betPlus = root.querySelector('#bet-plus');
    if (betMinus) betMinus.addEventListener('click', () => adjustBet(-10));
    if (betPlus) betPlus.addEventListener('click', () => adjustBet(10));

    root.querySelectorAll('[data-pick]').forEach(btn => {
      btn.addEventListener('click', () => {
        if (state.busy) return;
        const gname = state.screen.split(':')[1];
        if (gname === 'dice') dicePick = btn.dataset.pick;
        if (gname === 'coin') coinPick = btn.dataset.pick;
        render();
      });
    });

    const actionBtn = root.querySelector('#action-btn');
    if (actionBtn) {
      actionBtn.addEventListener('click', () => {
        const gname = state.screen.split(':')[1];
        if (gname === 'slots') spinSlots();
        if (gname === 'dice') rollDice();
        if (gname === 'coin') flipCoin();
      });
    }

    root.querySelectorAll('[data-quest]').forEach(btn => {
      btn.addEventListener('click', () => {
        const q = QUESTS.find(x => x.id === btn.dataset.quest);
        if (q) claimQuest(q);
      });
    });

    root.querySelectorAll('[data-frame]').forEach(btn => {
      btn.addEventListener('click', () => {
        const f = frameById(btn.dataset.frame);
        buyFrame(f);
      });
    });

    const inviteBtn = root.querySelector('#invite-btn');
    if (inviteBtn) inviteBtn.addEventListener('click', copyInvite);

    const resetBtn = root.querySelector('#reset-btn');
    if (resetBtn) resetBtn.addEventListener('click', resetProgress);

    if (state.navTab === 'games' && state.screen === 'home') startRaceTimer();
    else if (raceTimerInterval) { clearInterval(raceTimerInterval); raceTimerInterval = null; }
  }

  async function init() {
    root.innerHTML = '<div class="loading-screen">Тасуем колоду…</div>';
    syncViewportHeight();
    syncSafeArea();
    await loadState();
    applyTelegramUser();
    render();
    syncViewportHeight();
    syncSafeArea();
  }

  init();
})();
</script>
</body>
</html>
