<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Lucky Lounge</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  html, body {
    margin: 0;
    padding: 0;
    height: 100%;
    background: #08080a;
    overscroll-behavior: none;
  }

  #app-root {
    --bg: #0a0a0c;
    --bg-raise: #1a1a1e;
    --bg-raise-2: #232327;
    --border: #2c2c31;
    --gold: #d9a63e;
    --gold-bright: #f0c25f;
    --gold-dim: #8a6b2c;
    --cream: #f0ece2;
    --dim: #9a9aa3;
    --dim-2: #6d6d76;
    --win: #5fbf73;
    --lose: #d9705f;
    --live: #e0554a;
    --felt: #114a35;
    --felt-bright: #1a6b4c;

    font-family: 'IBM Plex Mono', monospace;
    color: var(--cream);
    background: var(--bg);
    height: 100dvh;
    height: 100vh;
    width: 100%;
    max-width: 480px;
    margin: 0 auto;
    display: flex;
    flex-direction: column;
    position: relative;
    overflow: hidden;
  }

  @import url('https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;900&family=IBM+Plex+Mono:wght@400;500;600;700&display=swap');

  #app-root * { box-sizing: border-box; }
  #app-root button { font-family: inherit; }

  /* ---------- Top bar ---------- */
  #app-root .topbar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 14px 16px 10px;
    padding-top: max(14px, env(safe-area-inset-top, 14px), var(--tg-content-safe-area-inset-top, 0px));
    border-bottom: 1px solid var(--border);
    flex-shrink: 0;
  }
  #app-root .topbar .brand {
    display: flex;
    align-items: center;
    gap: 8px;
    font-family: 'Playfair Display', serif;
    font-weight: 900;
    font-size: 18px;
    color: var(--gold-bright);
  }
  #app-root .topbar .brand .suit { font-size: 15px; }
  #app-root .balance-pill {
    display: flex;
    align-items: center;
    gap: 7px;
    background: var(--bg-raise);
    border: 1px solid var(--border);
    border-radius: 20px;
    padding: 6px 12px;
    font-weight: 700;
    font-size: 14px;
    color: var(--gold-bright);
  }
  #app-root .balance-pill .chip-icon {
    width: 16px; height: 16px;
    border-radius: 50%;
    background: conic-gradient(var(--gold-bright), var(--gold-dim), var(--gold-bright));
    display: inline-block;
  }
  #app-root .avatar-mini {
    width: 30px; height: 30px;
    border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    font-size: 14px;
    margin-left: 8px;
    flex-shrink: 0;
  }

  /* ---------- Scroll area ---------- */
  #app-root .scroll {
    flex: 1;
    overflow-y: auto;
    -webkit-overflow-scrolling: touch;
    padding: 14px 16px 20px;
  }
  #app-root .scroll::-webkit-scrollbar { display: none; }

  #app-root .live-status {
    display: flex; align-items: center; gap: 6px;
    justify-content: center;
    font-size: 11.5px;
    color: var(--dim);
    margin-bottom: 12px;
  }
  #app-root .live-dot {
    width: 6px; height: 6px; border-radius: 50%;
    background: var(--win);
    box-shadow: 0 0 5px var(--win);
  }

  /* ---------- Activity race card ---------- */
  #app-root .race-card {
    background: linear-gradient(180deg, var(--bg-raise), var(--bg-raise-2));
    border: 1px solid var(--gold-dim);
    border-radius: 14px;
    padding: 14px 16px;
    margin-bottom: 16px;
  }
  #app-root .race-head {
    display: flex; justify-content: space-between; align-items: center;
    margin-bottom: 8px;
  }
  #app-root .race-title {
    display: flex; align-items: center; gap: 6px;
    font-weight: 700; font-size: 14px; color: var(--cream);
  }
  #app-root .race-timer {
    font-size: 11px; color: var(--dim);
    font-variant-numeric: tabular-nums;
  }
  #app-root .race-prize {
    font-size: 12px; color: var(--gold-bright);
    margin-bottom: 10px;
    display: flex; align-items: center; gap: 5px;
  }
  #app-root .race-row {
    display: flex; align-items: center; gap: 10px;
    padding: 6px 0;
    font-size: 12.5px;
  }
  #app-root .race-row .medal { width: 18px; text-align: center; font-size: 13px; }
  #app-root .race-row .avatar-sm {
    width: 26px; height: 26px; border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    font-size: 12px; flex-shrink: 0;
  }
  #app-root .race-row .name { flex: 1; color: var(--cream); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  #app-root .race-row .score { color: var(--dim); font-variant-numeric: tabular-nums; font-size: 11.5px; }
  #app-root .race-foot {
    display: flex; justify-content: space-between;
    margin-top: 8px; padding-top: 8px;
    border-top: 1px solid var(--border);
    font-size: 11px; color: var(--dim);
  }

  /* ---------- Category pills ---------- */
  #app-root .pill-row { display: flex; gap: 8px; margin-bottom: 16px; }
  #app-root .cat-pill {
    border: 1px solid var(--border);
    background: var(--bg-raise);
    color: var(--dim);
    border-radius: 18px;
    padding: 8px 14px;
    font-size: 12px;
    font-weight: 600;
  }
  #app-root .cat-pill.active {
    background: var(--gold-bright);
    color: #1a1305;
    border-color: var(--gold-bright);
  }

  #app-root .section-label {
    display: flex; align-items: center; justify-content: space-between;
    font-size: 10.5px; letter-spacing: 1px; text-transform: uppercase;
    color: var(--dim-2);
    margin: 4px 0 10px;
  }

  /* ---------- Game cards grid ---------- */
  #app-root .game-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
  }
  #app-root .game-card {
    position: relative;
    border-radius: 14px;
    overflow: hidden;
    aspect-ratio: 1 / 0.95;
    border: 1px solid var(--border);
    cursor: pointer;
    background: #111;
  }
  #app-root .game-card .art {
    position: absolute; inset: 0;
  }
  #app-root .game-card .scrim {
    position: absolute; inset: 0;
    background: linear-gradient(180deg, rgba(0,0,0,0) 40%, rgba(0,0,0,0.85) 100%);
  }
  #app-root .live-badge {
    position: absolute; top: 8px; left: 8px;
    display: flex; align-items: center; gap: 4px;
    background: rgba(0,0,0,0.55);
    border-radius: 10px;
    padding: 3px 7px;
    font-size: 9.5px;
    font-weight: 700;
    color: var(--live);
  }
  #app-root .live-badge .dot {
    width: 5px; height: 5px; border-radius: 50%;
    background: var(--live);
  }
  #app-root .soon-badge {
    position: absolute; top: 8px; left: 8px;
    background: rgba(0,0,0,0.55);
    border-radius: 10px;
    padding: 3px 8px;
    font-size: 9.5px;
    font-weight: 700;
    color: var(--dim);
  }
  #app-root .game-card .info {
    position: absolute; left: 10px; right: 10px; bottom: 9px;
  }
  #app-root .game-card .g-title {
    font-weight: 800; font-size: 13.5px; color: #fff;
    margin-bottom: 2px;
  }
  #app-root .game-card .g-sub {
    font-size: 9.5px; color: rgba(255,255,255,0.65);
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  #app-root .game-card.disabled { opacity: 0.55; cursor: default; }

  /* art gradients per game */
  #app-root .art-slots { background: radial-gradient(circle at 30% 20%, #3a2c0f, #0d0902 75%); }
  #art-slots-svg { width: 100%; height: 100%; }
  #app-root .art-dice { background: radial-gradient(circle at 70% 25%, #1c2f22, #060a07 75%); }
  #app-root .art-coin { background: radial-gradient(circle at 40% 30%, #2c230a, #0a0803 75%); }
  #app-root .art-soon1 {
    background:
      radial-gradient(circle at 65% 70%, rgba(240,194,95,0.35), transparent 40%),
      linear-gradient(200deg, #241708 0%, #0a0603 70%);
  }
  #app-root .art-soon2 { background: radial-gradient(circle at 40% 25%, #131c22, #05080a 75%); }

  /* ---------- Sub-game screen ---------- */
  #app-root .game-header {
    display: flex; align-items: center; gap: 10px;
    margin-bottom: 14px;
  }
  #app-root .back-btn {
    background: var(--bg-raise);
    border: 1px solid var(--border);
    color: var(--cream);
    width: 32px; height: 32px;
    border-radius: 50%;
    font-size: 16px;
    display: flex; align-items: center; justify-content: center;
  }
  #app-root .game-header .g-name {
    font-family: 'Playfair Display', serif;
    font-weight: 800; font-size: 17px;
    color: var(--gold-bright);
  }

  #app-root .stage {
    display: flex; flex-direction: column; align-items: center;
    padding: 6px 0 10px;
  }
  #app-root .game-sub {
    font-size: 11px; color: var(--dim);
    margin-bottom: 16px; text-align: center; line-height: 1.5;
  }

  #app-root .reels {
    display: flex; gap: 8px;
    background: #050505;
    border: 2px solid var(--gold-dim);
    border-radius: 12px;
    padding: 14px 12px;
  }
  #app-root .reel {
    width: 56px; height: 64px;
    background: linear-gradient(180deg, #1a1a1a, #0a0a0a);
    border-radius: 8px;
    display: flex; align-items: center; justify-content: center;
    font-size: 30px; overflow: hidden;
    border: 1px solid rgba(217,166,62,0.3);
  }
  #app-root .reel span { display: inline-block; }
  #app-root .reel.spinning span { animation: spin-symbol 0.12s linear infinite; }
  @keyframes spin-symbol { 0% { transform: translateY(-20px); } 100% { transform: translateY(20px); } }

  #app-root .paytable {
    margin-top: 14px; font-size: 10px; color: var(--dim);
    display: grid; grid-template-columns: repeat(3, 1fr);
    gap: 4px 10px; text-align: left;
  }
  #app-root .paytable div span:last-child { color: var(--gold); }

  #app-root .dice-row { display: flex; gap: 18px; margin-bottom: 10px; }
  #app-root .die {
    width: 54px; height: 54px; background: var(--cream);
    border-radius: 10px; display: flex; align-items: center; justify-content: center;
    font-size: 26px; font-weight: 700; color: #111;
  }
  #app-root .die.rolling { animation: shake 0.1s linear infinite; }
  @keyframes shake { 0% { transform: rotate(-8deg); } 50% { transform: rotate(8deg); } 100% { transform: rotate(-8deg); } }
  #app-root .dice-total { font-size: 13px; color: var(--gold-bright); margin-bottom: 14px; }

  #app-root .coin {
    width: 90px; height: 90px; border-radius: 50%;
    background: radial-gradient(circle at 35% 30%, var(--gold-bright), var(--gold) 60%, #6b501f 100%);
    display: flex; align-items: center; justify-content: center;
    font-family: 'Playfair Display', serif; font-weight: 900; font-size: 15px; color: #1a1305;
    margin-bottom: 16px; border: 2px solid #6b501f;
  }
  #app-root .coin.flipping { animation: flip 0.15s linear infinite; }
  @keyframes flip { 0% { transform: rotateY(0) scale(1); } 50% { transform: rotateY(180deg) scale(0.85); } 100% { transform: rotateY(360deg) scale(1); } }

  #app-root .pick-row { display: flex; gap: 8px; margin-bottom: 14px; }
  #app-root .choice-btn {
    font-size: 11px; background: transparent;
    border: 1.5px solid var(--dim-2); color: var(--cream);
    border-radius: 8px; padding: 8px 14px; text-transform: uppercase;
  }
  #app-root .choice-btn.active { border-color: var(--gold); background: rgba(217,166,62,0.15); color: var(--gold-bright); }

  #app-root .bet-row { display: flex; align-items: center; gap: 10px; margin: 16px 0 8px; }
  #app-root .bet-btn {
    width: 30px; height: 30px; border-radius: 50%;
    border: 1px solid var(--gold-dim); background: transparent; color: var(--gold-bright);
    font-size: 16px; display: flex; align-items: center; justify-content: center;
  }
  #app-root .bet-amount { font-weight: 700; font-size: 15px; min-width: 70px; text-align: center; }

  #app-root .spin-btn {
    font-family: 'Playfair Display', serif; font-weight: 900; font-size: 15px;
    background: linear-gradient(180deg, var(--gold-bright), var(--gold-dim));
    color: #1a1305; border: none; border-radius: 22px; padding: 10px 34px;
    text-transform: uppercase; box-shadow: 0 3px 0 #5c4419;
  }
  #app-root .spin-btn:active { transform: translateY(2px); box-shadow: none; }
  #app-root .spin-btn:disabled { opacity: 0.45; }

  #app-root .result-msg { margin-top: 14px; min-height: 18px; font-size: 12.5px; font-weight: 700; }
  #app-root .result-msg.win { color: var(--win); }
  #app-root .result-msg.lose { color: var(--lose); }
  #app-root .broke-msg { margin-top: 12px; font-size: 10.5px; color: var(--dim); text-align: center; line-height: 1.6; }

  /* ---------- Rocket (crash game) ---------- */
  #app-root .rocket-headrow {
    display: flex; align-items: center; justify-content: space-between;
    margin-bottom: 4px;
  }
  #app-root .sound-btn {
    width: 30px; height: 30px; border-radius: 50%;
    background: var(--bg-raise); border: 1px solid var(--border);
    color: var(--dim); font-size: 13px;
    display: flex; align-items: center; justify-content: center;
  }
  #app-root .sound-btn.on { color: var(--gold-bright); border-color: var(--gold-dim); }

  #app-root .history-row {
    display: flex; gap: 6px; overflow-x: auto; margin: 10px 0 12px;
    -webkit-overflow-scrolling: touch;
  }
  #app-root .history-row::-webkit-scrollbar { display: none; }
  #app-root .history-chip {
    flex-shrink: 0; font-size: 11px; font-weight: 700;
    padding: 5px 9px; border-radius: 12px;
  }
  #app-root .history-chip.hi { background: rgba(95,191,115,0.15); color: var(--win); }
  #app-root .history-chip.lo { background: rgba(217,112,95,0.15); color: var(--lose); }

  #app-root .rocket-stage {
    position: relative;
    width: 100%;
    height: 260px;
    background:
      radial-gradient(ellipse at 20% 100%, rgba(217,166,62,0.06) 0%, transparent 55%),
      #08080a;
    border: 1px solid var(--border);
    border-radius: 14px;
    overflow: hidden;
    margin-bottom: 14px;
  }
  #app-root .rocket-stage svg { position: absolute; inset: 0; width: 100%; height: 100%; }
  #app-root .rocket-stars circle { fill: rgba(255,255,255,0.5); }
  #app-root .axis-line { stroke: rgba(255,255,255,0.08); stroke-width: 1; }
  #app-root .axis-label {
    fill: var(--dim-2); font-size: 9px; font-family: 'IBM Plex Mono', monospace;
  }
  #app-root .trail-dot { opacity: 0.55; }

  #app-root .rocket-mult {
    position: absolute; top: 42%; left: 50%;
    transform: translate(-50%, -50%);
    font-family: 'Playfair Display', serif;
    font-weight: 900; font-size: 40px;
    color: var(--cream);
    text-shadow: 0 0 20px rgba(0,0,0,0.6);
    z-index: 3;
    transition: color 0.2s ease;
  }
  #app-root .rocket-mult.crashed { color: var(--lose); }
  #app-root .rocket-mult.cashed { color: var(--win); }
  #app-root .rocket-status {
    position: absolute; bottom: 10px; left: 0; right: 0;
    text-align: center; font-size: 11.5px; color: var(--gold-bright);
    z-index: 3;
  }
  #app-root .rocket-emoji {
    position: absolute; font-size: 20px; z-index: 2;
  }

  #app-root .rocket-panel {
    background: var(--bg-raise);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 14px;
    margin-bottom: 10px;
  }
  #app-root .bet-input-row {
    display: flex; align-items: center; justify-content: space-between;
    background: var(--bg-raise-2); border: 1px solid var(--border);
    border-radius: 10px; padding: 10px 12px; margin-bottom: 10px;
  }
  #app-root .bet-input-row .bi-label { font-size: 9.5px; color: var(--dim); text-transform: uppercase; letter-spacing: 1px; }
  #app-root .bet-input-row .bi-value { font-size: 19px; font-weight: 800; color: var(--cream); }
  #app-root .bet-input-row .bi-ops { display: flex; gap: 6px; }
  #app-root .bi-op-btn {
    background: var(--bg-raise); border: 1px solid var(--border);
    color: var(--cream); border-radius: 8px; padding: 6px 10px; font-size: 11px; font-weight: 700;
  }
  #app-root .rocket-quick-row { display: flex; gap: 8px; margin: 0 0 10px; }
  #app-root .rocket-quick-btn {
    flex: 1; background: var(--bg-raise-2); border: 1px solid var(--border);
    color: var(--cream); border-radius: 10px; padding: 8px 0; font-size: 12px; font-weight: 600;
  }
  #app-root .rocket-quick-btn.active { border-color: var(--gold); color: var(--gold-bright); }
  #app-root .rocket-auto-row {
    display: flex; align-items: center; justify-content: space-between;
    margin: 10px 0; font-size: 12px; color: var(--dim);
  }
  #app-root .rocket-auto-row input {
    width: 60px; background: var(--bg-raise-2); border: 1px solid var(--border);
    color: var(--cream); border-radius: 8px; padding: 5px 8px; font-size: 12px;
    font-family: inherit; text-align: center;
  }
  #app-root .rocket-toggle {
    width: 34px; height: 20px; border-radius: 10px; background: var(--bg-raise-2);
    border: 1px solid var(--border); position: relative; flex-shrink: 0;
  }
  #app-root .rocket-toggle.on { background: var(--gold-dim); }
  #app-root .rocket-toggle .knob {
    position: absolute; top: 1px; left: 1px; width: 16px; height: 16px; border-radius: 50%;
    background: var(--cream); transition: left 0.15s ease;
  }
  #app-root .rocket-toggle.on .knob { left: 15px; background: var(--gold-bright); }

  #app-root .rocket-action-btn {
    width: 100%; font-family: 'Playfair Display', serif; font-weight: 900; font-size: 15px;
    background: linear-gradient(180deg, var(--gold-bright), var(--gold-dim));
    color: #1a1305; border: none; border-radius: 12px; padding: 13px;
    text-transform: uppercase; margin-top: 4px;
  }
  #app-root .rocket-action-btn:disabled { opacity: 0.45; }
  #app-root .rocket-action-btn.cashout {
    background: linear-gradient(180deg, var(--win), #2f7a3f);
    color: #072b0e;
  }
  #app-root .second-bet-row {
    display: flex; align-items: center; justify-content: space-between;
    font-size: 12px; color: var(--dim); padding: 4px 2px;
  }
  #app-root .rocket-note {
    font-size: 10.5px; color: var(--dim-2); line-height: 1.6;
    background: var(--bg-raise); border: 1px solid var(--border); border-left: 2px solid var(--gold-dim);
    border-radius: 8px; padding: 10px 12px; margin-top: 6px;
  }


  /* ---------- Bonus button (games home) ---------- */
  #app-root .bonus-btn {
    width: 100%;
    font-size: 12px; font-weight: 700; letter-spacing: 0.5px;
    background: linear-gradient(180deg, var(--gold-bright), var(--gold-dim));
    color: #1a1305; border: none; border-radius: 12px; padding: 11px;
    text-transform: uppercase; margin-bottom: 16px;
  }
  #app-root .bonus-btn:disabled { background: var(--bg-raise); color: var(--dim); }

  /* ---------- Quests ---------- */
  #app-root .quest-card {
    background: var(--bg-raise);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 12px 14px;
    margin-bottom: 10px;
    display: flex; align-items: center; gap: 12px;
  }
  #app-root .quest-card .q-icon { font-size: 22px; flex-shrink: 0; }
  #app-root .quest-card .q-body { flex: 1; min-width: 0; }
  #app-root .quest-card .q-title { font-size: 12.5px; font-weight: 700; color: var(--cream); margin-bottom: 2px; }
  #app-root .quest-card .q-desc { font-size: 10.5px; color: var(--dim); }
  #app-root .quest-card .q-bar-track {
    height: 4px; background: var(--bg-raise-2); border-radius: 2px; margin-top: 6px; overflow: hidden;
  }
  #app-root .quest-card .q-bar-fill { height: 100%; background: var(--gold-bright); }
  #app-root .quest-btn {
    flex-shrink: 0; font-size: 10.5px; font-weight: 700;
    border-radius: 10px; padding: 7px 12px; border: none;
  }
  #app-root .quest-btn.claim { background: var(--gold-bright); color: #1a1305; }
  #app-root .quest-btn.done { background: var(--bg-raise-2); color: var(--dim-2); }
  #app-root .quest-btn.locked { background: var(--bg-raise-2); color: var(--dim-2); }

  /* ---------- Shop ---------- */
  #app-root .shop-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  #app-root .shop-card {
    background: var(--bg-raise);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 14px 10px;
    text-align: center;
  }
  #app-root .shop-card .frame-preview {
    width: 52px; height: 52px; border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    font-size: 22px; margin: 0 auto 8px;
  }
  #app-root .shop-card .s-name { font-size: 11.5px; font-weight: 700; margin-bottom: 8px; }
  #app-root .shop-btn {
    width: 100%; font-size: 10.5px; font-weight: 700;
    border-radius: 8px; padding: 7px; border: none;
  }
  #app-root .shop-btn.buy { background: var(--gold-bright); color: #1a1305; }
  #app-root .shop-btn.equip { background: var(--bg-raise-2); color: var(--cream); border: 1px solid var(--gold-dim); }
  #app-root .shop-btn.equipped { background: var(--win); color: #072b0e; }

  /* ---------- Friends ---------- */
  #app-root .friend-card {
    background: var(--bg-raise); border: 1px solid var(--border);
    border-radius: 12px; padding: 16px; text-align: center; margin-bottom: 14px;
  }
  #app-root .friend-card .f-big { font-size: 30px; margin-bottom: 6px; }
  #app-root .friend-card .f-title { font-weight: 700; font-size: 13.5px; margin-bottom: 4px; }
  #app-root .friend-card .f-desc { font-size: 11px; color: var(--dim); margin-bottom: 12px; line-height: 1.5; }
  #app-root .invite-btn {
    background: linear-gradient(180deg, var(--gold-bright), var(--gold-dim));
    color: #1a1305; border: none; border-radius: 20px; padding: 10px 20px;

  }
  #app-root .empty-note {
    text-align: center; font-size: 11px; color: var(--dim-2); padding: 20px 0;

  /* ---------- Profile ---------- */
  #app-root .profile-head { text-align: center; padding: 10px 0 18px; }
  #app-root .profile-avatar {
    width: 74px; height: 74px; border-radius: 50%;
    display: flex; align-items: center; justify-content: center;

  }
  #app-root .profile-name { font-weight: 700; font-size: 15px; }
  #app-root .profile-sub { font-size: 10.5px; color: var(--dim); margin-top: 3px; }
  #app-root .stat-grid {
    display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 16px;
  }
  #app-root .stat-card {
    background: var(--bg-raise); border: 1px solid var(--border);
    border-radius: 12px; padding: 12px; text-align: center;
  }
  #app-root .stat-card .val { font-size: 17px; font-weight: 800; color: var(--gold-bright); }
  #app-root .stat-card .lbl { font-size: 9.5px; color: var(--dim); text-transform: uppercase; margin-top: 2px; }
  #app-root .reset-btn {
    width: 100%; background: transparent; border: 1px solid var(--lose);
    color: var(--lose); border-radius: 10px; padding: 10px; font-size: 11.5px; font-weight: 700;

  /* ---------- Bottom nav ---------- */
  #app-root .tabbar {
    display: flex;
    border-top: 1px solid var(--border);

  #app-root .tab.active .icon { opacity: 1; }

  #app-root .toast {
    position: absolute; top: 10px; left: 50%; transform: translateX(-50%);
    background: var(--gold-bright); color: #1a1305; font-size: 11px; font-weight: 700;
    padding: 6px 14px; border-radius: 16px; opacity: 0; pointer-events: none;
    transition: opacity 0.3s ease, top 0.3s ease; z-index: 20; white-space: nowrap;
  }
  #app-root .toast.show { opacity: 1; top: 16px; }

  #app-root .loading-screen {
    display: flex; align-items: center; justify-content: center;
    height: 100%; font-size: 12px; color: var(--dim);
  }
</style>
</head>
<body>
<div id="app-root"></div>

<script>
(function () {
  // --- Telegram WebApp integration ---
  const tg = window.Telegram && window.Telegram.WebApp;
  if (tg) {
    tg.ready();
    tg.expand();
    tg.disableVerticalSwipes && tg.disableVerticalSwipes();
    try {
      tg.setHeaderColor && tg.setHeaderColor('#0a0a0c');
      tg.setBackgroundColor && tg.setBackgroundColor('#08080a');
    } catch (e) {}
  }

  const root = document.getElementById('app-root');

  function syncSafeArea() {
    if (!tg) return;
    const applyInset = () => {
      const csa = tg.contentSafeAreaInset || {};
      const sa = tg.safeAreaInset || {};
      const top = Math.max(csa.top || 0, sa.top || 0);
      root.style.setProperty('--tg-content-safe-area-inset-top', top + 'px');
    };
    applyInset();
    tg.onEvent && tg.onEvent('safeAreaChanged', applyInset);
    tg.onEvent && tg.onEvent('contentSafeAreaChanged', applyInset);
  }

  function syncViewportHeight() {
    if (!root) return;
    const h = (tg && tg.viewportStableHeight) ? tg.viewportStableHeight : window.innerHeight;
    root.style.height = h + 'px';
  }
  if (tg) { tg.onEvent && tg.onEvent('viewportChanged', syncViewportHeight); }
  window.addEventListener('resize', syncViewportHeight);

  const BOT_LINK = 'https://t.me/FragmentLoungebot/FragmentLounge';

  const STARTING_BALANCE = 1000;
  const BONUS_AMOUNT = 200;
  const BONUS_COOLDOWN_MS = 24 * 60 * 60 * 1000;

  const FRAMES = [
    { id: 'none',   name: 'Простая',    cost: 0,   bg: '#2c2c31', ring: 'transparent', emoji: '🙂' },
    { id: 'gold',   name: 'Золотая',    cost: 300, bg: '#3a2c0f', ring: '#d9a63e',      emoji: '😎' },
    { id: 'ruby',   name: 'Рубиновая',  cost: 500, bg: '#3a1018', ring: '#c94a5a',      emoji: '🔥' },
    { id: 'royal',  name: 'Королевская',cost: 900, bg: '#12222f', ring: '#5fa8d9',      emoji: '👑' },
  ];

  const QUESTS = [
    { id: 'first_spin', icon: '🎯', title: 'Первая ставка', desc: 'Сделай ставку в любой игре', reward: 50,
      progress: s => Math.min(1, s.totalSpins), target: 1 },
    { id: 'try_all', icon: '🃏', title: 'Испытай удачу', desc: 'Сыграй в слоты, кости, монетку и ракету', reward: 100,
      progress: s => Object.values(s.gamesPlayed).filter(Boolean).length, target: 4 },
    { id: 'ten_wins', icon: '🏆', title: '10 побед', desc: 'Выиграй 10 раз в сумме', reward: 200,
      progress: s => Math.min(10, s.totalWins), target: 10 },
    { id: 'reach_2000', icon: '💰', title: 'Крупный банк', desc: 'Накопи 2000 фишек на балансе', reward: 150,
      progress: s => Math.min(2000, s.maxBalance), target: 2000 },
    { id: 'reach_5000', icon: '💎', title: 'Высшая лига', desc: 'Накопи 5000 фишек на балансе', reward: 400,
      progress: s => Math.min(5000, s.maxBalance), target: 5000 },
  ];

  let state = {
    balance: STARTING_BALANCE,
    lastBonus: 0,
    navTab: 'games',
    screen: 'home',
    bet: 20,
    busy: false,
    username: 'Игрок',
    equippedFrame: 'none',
    ownedFrames: ['none'],
    claimedQuests: [],
    stats: {
      totalSpins: 0,
      totalWins: 0,
      maxBalance: STARTING_BALANCE,
      gamesPlayed: { slots: false, dice: false, coin: false, rocket: false },
      joined: Date.now(),
    },
  };

  function fmt(n) { return Math.max(0, Math.floor(n)).toLocaleString('ru-RU'); }

  async function loadState() {
    try {
      const res = await window.storage.get('lucky-lounge-state-v2', false);
      if (res && res.value) {
        const saved = JSON.parse(res.value);
        state = Object.assign(state, saved);
        state.stats = Object.assign(state.stats, saved.stats || {});
        state.stats.gamesPlayed = Object.assign({ slots: false, dice: false, coin: false, rocket: false }, (saved.stats || {}).gamesPlayed || {});
      }
    } catch (e) { /* no saved state yet */ }
    state.navTab = 'games';
    state.screen = 'home';
  }

  async function saveState() {
    try {
      await window.storage.set('lucky-lounge-state-v2', JSON.stringify({
        balance: state.balance,
        lastBonus: state.lastBonus,
        username: state.username,
        equippedFrame: state.equippedFrame,
        ownedFrames: state.ownedFrames,
        claimedQuests: state.claimedQuests,
        stats: state.stats,
      }), false);
    } catch (e) { console.error('save failed', e); }
  }

  function touchStats(patch) {
    Object.assign(state.stats, patch);
    if (state.balance > state.stats.maxBalance) state.stats.maxBalance = state.balance;
  }

  function showToast(msg) {
    const t = root.querySelector('.toast');
    if (!t) return;
    t.textContent = msg;
    t.classList.add('show');
    setTimeout(() => t.classList.remove('show'), 1800);
  }

  function frameById(id) { return FRAMES.find(f => f.id === id) || FRAMES[0]; }

  function canClaimBonus() { return Date.now() - state.lastBonus >= BONUS_COOLDOWN_MS; }

  function claimBonus() {
    if (!canClaimBonus() || state.busy) return;
    state.balance += BONUS_AMOUNT;
    state.lastBonus = Date.now();
    touchStats({});
    saveState();
    showToast(`+${BONUS_AMOUNT} дневной бонус`);
    render();
  }

  function adjustBet(delta) {
    if (state.busy) return;
    state.bet = Math.max(10, Math.min(500, state.bet + delta));
    render();
  }

  function goNav(tab) {
    if (state.busy) return;
    stopRocketLoop();
    state.navTab = tab;
    state.screen = 'home';
    render();
  }

  function openGame(name) {
    if (state.busy) return;
    state.screen = 'game:' + name;
    slotResult = null; diceResult = null; coinResult = null;
    render();
    if (name === 'rocket') startRocketLoop();
  }

  function closeGame() {
    if (state.busy) return;
    stopRocketLoop();
    state.screen = 'home';
    render();
  }

  // ---------- Slots ----------
  const SLOT_SYMBOLS = [
    { icon: '🍋', weight: 30, mult: 2 },
    { icon: '🍒', weight: 24, mult: 3 },
    { icon: '🔔', weight: 16, mult: 5 },
    { icon: '⭐', weight: 10, mult: 8 },
    { icon: '💎', weight: 6,  mult: 15 },
    { icon: '7️⃣', weight: 2,  mult: 50 },
  ];
  function weightedSymbol() {
    const total = SLOT_SYMBOLS.reduce((s, x) => s + x.weight, 0);
    let r = Math.random() * total;
    for (const s of SLOT_SYMBOLS) { if (r < s.weight) return s; r -= s.weight; }
    return SLOT_SYMBOLS[0];
  }
  let slotResult = null;
  function spinSlots() {
    if (state.busy || state.balance < state.bet) return;
    state.busy = true;
    state.balance -= state.bet;
    slotResult = null;
    render();
    const reels = root.querySelectorAll('.reel');
    reels.forEach(r => r.classList.add('spinning'));
    const finals = [weightedSymbol(), weightedSymbol(), weightedSymbol()];
    const delays = [700, 1000, 1300];
    finals.forEach((sym, i) => {
      setTimeout(() => {
        const reel = reels[i];
        if (!reel) return;
        reel.classList.remove('spinning');
        reel.querySelector('span').textContent = sym.icon;
      }, delays[i]);
    });
    setTimeout(() => {
      const [a, b, c] = finals;
      let winnings = 0;
      if (a.icon === b.icon && b.icon === c.icon) winnings = state.bet * a.mult;
      state.balance += winnings;
      slotResult = { win: winnings > 0, amount: winnings, symbols: finals.map(f => f.icon) };
      touchStats({
        totalSpins: state.stats.totalSpins + 1,
        totalWins: state.stats.totalWins + (winnings > 0 ? 1 : 0),
        gamesPlayed: Object.assign({}, state.stats.gamesPlayed, { slots: true }),
      });
      state.busy = false;
      saveState();
      render();
    }, 1500);
  }

  // ---------- Dice ----------
  let dicePick = 'under';
  let diceResult = null;
  function rollDice() {
    if (state.busy || state.balance < state.bet) return;
    state.busy = true;
    state.balance -= state.bet;
    diceResult = null;
    render();
    const dice = root.querySelectorAll('.die');
    dice.forEach(d => d.classList.add('rolling'));
    setTimeout(() => {
      const d1 = 1 + Math.floor(Math.random() * 6);
      const d2 = 1 + Math.floor(Math.random() * 6);
      const total = d1 + d2;
      let win = false, mult = 0;
      if (dicePick === 'under' && total < 7) { win = true; mult = 1.9; }
      if (dicePick === 'over' && total > 7) { win = true; mult = 1.9; }
      if (dicePick === 'seven' && total === 7) { win = true; mult = 5; }
      const winnings = win ? Math.round(state.bet * mult) : 0;
      state.balance += winnings;
      diceResult = { d1, d2, total, win, amount: winnings };
      touchStats({
        totalSpins: state.stats.totalSpins + 1,
        totalWins: state.stats.totalWins + (win ? 1 : 0),
        gamesPlayed: Object.assign({}, state.stats.gamesPlayed, { dice: true }),
      });
      state.busy = false;
      saveState();
      render();
    }, 900);
  }

  // ---------- Coinflip ----------
  let coinPick = 'heads';
  let coinResult = null;
  function flipCoin() {
    if (state.busy || state.balance < state.bet) return;
    state.busy = true;
    state.balance -= state.bet;
    coinResult = null;
    render();
    const coin = root.querySelector('.coin');
    if (coin) coin.classList.add('flipping');
    setTimeout(() => {
      const outcome = Math.random() < 0.5 ? 'heads' : 'tails';
      const win = outcome === coinPick;
      const winnings = win ? Math.round(state.bet * 1.9) : 0;
      state.balance += winnings;
      coinResult = { outcome, win, amount: winnings };
      touchStats({
        totalSpins: state.stats.totalSpins + 1,
        totalWins: state.stats.totalWins + (win ? 1 : 0),
        gamesPlayed: Object.assign({}, state.stats.gamesPlayed, { coin: true }),
      });
      state.busy = false;
      saveState();
      render();
    }, 1000);
  }

  // ---------- Rocket (crash game) ----------
  let rocket = {
    phase: 'betting',       // 'betting' | 'flying' | 'crashed'
    countdown: 5,
    multiplier: 1.00,
    crashPoint: 2.00,
    startedAt: 0,
    bet: null,               // { amount, cashedOut, cashOutAt }
    bet2: null,
    secondBetOn: false,
    autoOn: false,
    autoTarget: 2.0,
    history: [1.40, 2.10, 1.00, 5.60, 1.20, 3.00],
  };
  let rocketBetAmount = 50;
  let rocketBetAmount2 = 50;
  let rocketTimer = null;
  let rocketRunning = false;
  let rocketSoundOn = true;
  let audioCtx = null;

  const ROCKET_STARS = Array.from({ length: 16 }).map((_, i) => ({
    x: (i * 37 + 11) % 100,
    y: (i * 53 + 7) % 90,
    r: (i % 3 === 0) ? 1.4 : 0.8,
  }));

  function playTone(freq, duration, type) {
    if (!rocketSoundOn) return;
    try {
      if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = type || 'sine';
      osc.frequency.value = freq;
      gain.gain.setValueAtTime(0.08, audioCtx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + duration);
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      osc.start();
      osc.stop(audioCtx.currentTime + duration);
    } catch (e) { /* audio not available */ }
  }
  function sfxBet() { playTone(520, 0.08, 'triangle'); }
  function sfxCashout() { playTone(660, 0.09, 'sine'); setTimeout(() => playTone(880, 0.12, 'sine'), 90); }
  function sfxCrash() { playTone(140, 0.35, 'sawtooth'); }

  function toggleRocketSound() {
    rocketSoundOn = !rocketSoundOn;
    if (rocketSoundOn) playTone(700, 0.06, 'sine');
    renderRocketOnly();
  }

  function generateCrashPoint() {
    // ~4% instant-crash chance (house edge), otherwise a long-tailed draw
    if (Math.random() < 0.04) return 1.00;
    const e = Math.random();
    const raw = 0.97 / (1 - e);
    return Math.max(1.00, Math.min(60, Math.round(raw * 100) / 100));
  }

  function rocketStartBettingPhase() {
    rocket.phase = 'betting';
    rocket.countdown = 5;
    rocket.multiplier = 1.00;
    rocket.crashPoint = generateCrashPoint();
    rocket.startedAt = 0;
    rocket.bet = null;
    rocket.bet2 = null;
    renderRocketOnly();
    rocketTick();
  }

  function rocketTick() {
    clearTimeout(rocketTimer);
    if (!rocketRunning) return;

    if (rocket.phase === 'betting') {
      rocketTimer = setTimeout(() => {
        rocket.countdown -= 1;
        if (rocket.countdown <= 0) {
          rocket.phase = 'flying';
          rocket.startedAt = Date.now();
        }
        renderRocketOnly();
        rocketTick();
      }, 1000);
      return;
    }

    if (rocket.phase === 'flying') {
      rocketTimer = setTimeout(() => {
        const elapsed = Date.now() - rocket.startedAt;
        rocket.multiplier = Math.min(rocket.crashPoint, Math.pow(1.00013, elapsed));
        rocket.multiplier = Math.round(rocket.multiplier * 100) / 100;

        if (rocket.bet && !rocket.bet.cashedOut && rocket.autoOn && rocket.multiplier >= rocket.autoTarget) {
          rocketCashOut(1, true);
        }
        if (rocket.bet2 && !rocket.bet2.cashedOut && rocket.autoOn && rocket.multiplier >= rocket.autoTarget) {
          rocketCashOut(2, true);
        }

        if (rocket.multiplier >= rocket.crashPoint) {
          rocket.multiplier = rocket.crashPoint;
          rocket.phase = 'crashed';
          rocket.history.unshift(rocket.crashPoint);
          rocket.history = rocket.history.slice(0, 10);
          const lostBet = (rocket.bet && !rocket.bet.cashedOut) || (rocket.bet2 && !rocket.bet2.cashedOut);
          if (lostBet) {
            sfxCrash();
            touchStats({
              totalSpins: state.stats.totalSpins + 1,
              gamesPlayed: Object.assign({}, state.stats.gamesPlayed, { rocket: true }),
            });
            saveState();
          }
          renderRocketOnly();
          rocketTimer = setTimeout(() => {
            if (rocketRunning) rocketStartBettingPhase();
          }, 2600);
          return;
        }
        renderRocketOnly();
        rocketTick();
      }, 60);
    }
  }

  function rocketPlaceBet(slot) {
    const amount = slot === 2 ? rocketBetAmount2 : rocketBetAmount;
    const key = slot === 2 ? 'bet2' : 'bet';
    if (rocket.phase !== 'betting' || rocket[key]) return;
    if (state.balance < amount) { showToast('Недостаточно фишек'); return; }
    state.balance -= amount;
    rocket[key] = { amount, cashedOut: false, cashOutAt: null };
    sfxBet();
    saveState();
    renderRocketOnly();
  }

  function rocketCashOut(slot, auto) {
    const key = slot === 2 ? 'bet2' : 'bet';
    const bet = rocket[key];
    if (rocket.phase !== 'flying' || !bet || bet.cashedOut) return;
    const winnings = Math.round(bet.amount * rocket.multiplier);
    state.balance += winnings;
    bet.cashedOut = true;
    bet.cashOutAt = rocket.multiplier;
    sfxCashout();
    touchStats({
      totalSpins: state.stats.totalSpins + 1,
      totalWins: state.stats.totalWins + 1,
      gamesPlayed: Object.assign({}, state.stats.gamesPlayed, { rocket: true }),
    });
    saveState();
    if (!auto) showToast(`Забрали ${winnings} фишек!`);
    renderRocketOnly();
  }

  function rocketSetBetAmount(v, slot) {
    const clamped = Math.max(10, Math.min(5000, Math.round(v)));
    if (slot === 2) rocketBetAmount2 = clamped; else rocketBetAmount = clamped;
    renderRocketOnly();
  }

  function rocketBetOp(op, slot) {
    const cur = slot === 2 ? rocketBetAmount2 : rocketBetAmount;
    let next = cur;
    if (op === 'half') next = Math.max(10, Math.round(cur / 2));
    if (op === 'double') next = Math.min(5000, cur * 2);
    if (op === 'max') next = Math.min(5000, Math.max(10, state.balance));
    rocketSetBetAmount(next, slot);
  }

  function rocketToggleAuto() {
    rocket.autoOn = !rocket.autoOn;
    renderRocketOnly();
  }

  function rocketSetAutoTarget(v) {
    const n = parseFloat(v);
    rocket.autoTarget = isNaN(n) ? 2.0 : Math.max(1.1, Math.min(50, n));
  }

  function rocketToggleSecondBet() {
    rocket.secondBetOn = !rocket.secondBetOn;
    renderRocketOnly();
  }

  // ---- graph: log-scale axis with adaptive top tick + sampled trail dots ----
  function rocketAxisTicks(currentVal) {
    const ticks = [2, 3, 5, 10];
    let top = 10;
    while (currentVal > top * 0.82) { top *= 2; ticks.push(Math.round(top)); }
    return { ticks, top };
  }

  function rocketGraphGeometry() {
    const W = 320, H = 260;
    const scaleRefVal = Math.max(rocket.multiplier, rocket.phase === 'crashed' ? rocket.crashPoint : 1);
    const { ticks, top } = rocketAxisTicks(scaleRefVal);
    const valueToY = (v) => {
      const t = Math.log(Math.max(1, v)) / Math.log(top);
      return H - Math.min(1, t) * (H - 24) - 4;
    };
    const progress = Math.min(1, (rocket.multiplier - 1) / Math.max(0.4, rocket.crashPoint - 1));
    const samples = 16;
    const points = [];
    for (let i = 0; i <= samples; i++) {
      const t = (i / samples) * progress;
      const val = 1 + t * (rocket.multiplier - 1);
      const x = t * W;
      const y = valueToY(val);
      points.push({ x, y, t });
    }
    const last = points[points.length - 1] || { x: 0, y: H - 4 };
    let d = points.length ? `M ${points[0].x.toFixed(1)} ${points[0].y.toFixed(1)}` : `M 0 ${H - 4}`;
    points.forEach(p => { d += ` L ${p.x.toFixed(1)} ${p.y.toFixed(1)}`; });
    return { W, H, ticks, top, valueToY, points, last, d };
  }

  function lerpColor(t) {
    // red-orange (start) -> gold (later)
    const a = [217, 112, 95];
    const b = [240, 194, 95];
    const r = Math.round(a[0] + (b[0] - a[0]) * t);
    const g = Math.round(a[1] + (b[1] - a[1]) * t);
    const bl = Math.round(a[2] + (b[2] - a[2]) * t);
    return `rgb(${r},${g},${bl})`;
  }

  function renderRocketScreen() {
    const s = rocket;
    const potential1 = s.bet ? Math.round(s.bet.amount * s.multiplier) : 0;
    const potential2 = s.bet2 ? Math.round(s.bet2.amount * s.multiplier) : 0;
    const statusText =
      s.phase === 'betting' ? `Приём ставок: ${s.countdown}с` :
      s.phase === 'flying' ? 'В полёте — заберите до взрыва' :
      'Взрыв! Новый раунд через мгновение…';

    const geo = rocketGraphGeometry();
    const multClass = s.phase === 'crashed' ? 'crashed' : ((s.bet && s.bet.cashedOut) || (s.bet2 && s.bet2.cashedOut) ? 'cashed' : '');

    function actionButtonFor(slot) {
      const key = slot === 2 ? 'bet2' : 'bet';
      const amt = slot === 2 ? rocketBetAmount2 : rocketBetAmount;
      const bet = s[key];
      if (s.phase !== 'flying') {
        const disabled = s.phase !== 'betting' || !!bet || state.balance < amt;
        return `<button class="rocket-action-btn" data-bet-slot="${slot}" ${disabled ? 'disabled' : ''}>🚀 Ставка ${amt} на след. раунд</button>`;
      }
      if (bet && !bet.cashedOut) {
        const potential = slot === 2 ? potential2 : potential1;
        return `<button class="rocket-action-btn cashout" data-cashout-slot="${slot}">Забрать ${potential}</button>`;
      }
      if (bet && bet.cashedOut) {
        return `<button class="rocket-action-btn" disabled>Забрано на ${bet.cashOutAt.toFixed(2)}x</button>`;
      }
      return `<button class="rocket-action-btn" disabled>Ставки закрыты</button>`;
    }

    return `
      <div class="game-header"><button class="back-btn" id="back-btn">‹</button><div class="g-name">🚀 Ракета</div></div>
      <div class="rocket-headrow">
        <div class="history-row" style="margin:0; flex:1;">

        <button class="sound-btn ${rocketSoundOn ? 'on' : ''}" id="rocket-sound-btn">${rocketSoundOn ? '🔊' : '🔇'}</button>

        <svg viewBox="0 0 ${geo.W} ${geo.H}" preserveAspectRatio="none">

          <g class="rocket-stars">

          </g>
          ${geo.ticks.map(t => {
            const y = geo.valueToY(t);
            return `<line class="axis-line" x1="0" y1="${y.toFixed(1)}" x2="${geo.W}" y2="${y.toFixed(1)}"></line>
                    <text class="axis-label" x="6" y="${(y - 4).toFixed(1)}">${t}x</text>`;
          }).join('')}
          <path d="${geo.d} L ${geo.last.x.toFixed(1)} ${geo.H} L 0 ${geo.H} Z" fill="url(#rocket-line-grad)"></path>
          <path d="${geo.d}" fill="none" stroke="${s.phase === 'crashed' ? '#d9705f' : '#f0c25f'}" stroke-width="2.5" stroke-linecap="round"></path>
          ${geo.points.slice(1, -1).filter((_, i) => i % 2 === 0).map(p =>
            `<circle class="trail-dot" cx="${p.x.toFixed(1)}" cy="${p.y.toFixed(1)}" r="3" fill="${lerpColor(p.t)}"></circle>`
          ).join('')}
        </svg>
        <div class="rocket-emoji" style="left:${geo.last.x}px; top:${geo.last.y}px; transform: translate(-50%, -50%) rotate(-45deg);">🚀</div>
        <div class="rocket-mult ${multClass}">${s.multiplier.toFixed(2)}x</div>
        <div class="rocket-status">${statusText}</div>
      </div>

      <div class="rocket-panel">
        <div class="bet-input-row">
          <div>
            <div class="bi-label">Ставка</div>
            <div class="bi-value">${rocketBetAmount}</div>
          </div>
          <div class="bi-ops">
            <button class="bi-op-btn" data-op="half" data-slot="1">1/2</button>
            <button class="bi-op-btn" data-op="double" data-slot="1">2×</button>
            <button class="bi-op-btn" data-op="max" data-slot="1">MAX</button>
          </div>
        </div>
        <div class="rocket-quick-row">
          <button class="rocket-quick-btn ${rocketBetAmount === 50 ? 'active' : ''}" data-amt="50" data-slot="1">50</button>
          <button class="rocket-quick-btn ${rocketBetAmount === 100 ? 'active' : ''}" data-amt="100" data-slot="1">100</button>
          <button class="rocket-quick-btn ${rocketBetAmount === 500 ? 'active' : ''}" data-amt="500" data-slot="1">500</button>
          <button class="rocket-quick-btn ${rocketBetAmount === 1000 ? 'active' : ''}" data-amt="1000" data-slot="1">1K</button>
        </div>
        <div class="rocket-auto-row">
          <span>Автовывод на ×<input type="number" step="0.1" min="1.1" id="rocket-auto-target" value="${s.autoTarget}" ${s.autoOn ? '' : 'disabled'}></span>
          <div class="rocket-toggle ${s.autoOn ? 'on' : ''}" id="rocket-auto-toggle"><div class="knob"></div></div>
        </div>
        ${actionButtonFor(1)}
      </div>

      <div class="rocket-panel">
        <div class="second-bet-row">
          <span>+ Вторая ставка</span>
          <div class="rocket-toggle ${s.secondBetOn ? 'on' : ''}" id="rocket-second-toggle"><div class="knob"></div></div>
        </div>
        ${s.secondBetOn ? `
          <div class="bet-input-row" style="margin-top:10px;">
            <div>
              <div class="bi-label">Ставка 2</div>
              <div class="bi-value">${rocketBetAmount2}</div>

    `;
  }

  function renderRocketOnly() {
    // lightweight re-render: only touch the rocket screen if it's currently shown
    if (state.navTab !== 'games' || state.screen !== 'game:rocket') return;
    const scroll = root.querySelector('.scroll');
    if (!scroll) return;
    scroll.innerHTML = renderRocketScreen();
    attachRocketHandlers();
  }

  function attachRocketHandlers() {
    const backBtn = root.querySelector('#back-btn');
    if (backBtn) backBtn.addEventListener('click', closeGame);

    const soundBtn = root.querySelector('#rocket-sound-btn');
    if (soundBtn) soundBtn.addEventListener('click', toggleRocketSound);

    root.querySelectorAll('[data-amt]').forEach(btn => {
      btn.addEventListener('click', () => rocketSetBetAmount(parseInt(btn.dataset.amt, 10), parseInt(btn.dataset.slot, 10)));
    });
    root.querySelectorAll('[data-op]').forEach(btn => {
      btn.addEventListener('click', () => rocketBetOp(btn.dataset.op, parseInt(btn.dataset.slot, 10)));
    });

    root.querySelectorAll('[data-bet-slot]').forEach(btn => {
      btn.addEventListener('click', () => rocketPlaceBet(parseInt(btn.dataset.betSlot, 10)));
    });
    root.querySelectorAll('[data-cashout-slot]').forEach(btn => {
      btn.addEventListener('click', () => rocketCashOut(parseInt(btn.dataset.cashoutSlot, 10), false));
    });

    const autoToggle = root.querySelector('#rocket-auto-toggle');
    if (autoToggle) autoToggle.addEventListener('click', rocketToggleAuto);

    const autoTarget = root.querySelector('#rocket-auto-target');
    if (autoTarget) autoTarget.addEventListener('change', (e) => rocketSetAutoTarget(e.target.value));

    const secondToggle = root.querySelector('#rocket-second-toggle');
    if (secondToggle) secondToggle.addEventListener('click', rocketToggleSecondBet);
  }

  function startRocketLoop() {
    if (rocketRunning) return;
    rocketRunning = true;
    rocketStartBettingPhase();
  }

  function stopRocketLoop() {
    rocketRunning = false;
    clearTimeout(rocketTimer);
  }

  // ---------- Quests ----------
  function claimQuest(q) {
    if (state.claimedQuests.includes(q.id)) return;
    if (q.progress(state.stats) < q.target) return;
    state.balance += q.reward;
    state.claimedQuests.push(q.id);
    touchStats({});
    saveState();
    showToast(`+${q.reward} за задание`);
    render();
  }

  // ---------- Shop ----------
  function buyFrame(f) {
    if (state.ownedFrames.includes(f.id)) { equipFrame(f); return; }
    if (state.balance < f.cost) { showToast('Недостаточно фишек'); return; }
    state.balance -= f.cost;
    state.ownedFrames.push(f.id);
    state.equippedFrame = f.id;
    saveState();
    showToast(`Куплено: ${f.name}`);
    render();
  }
  function equipFrame(f) {
    state.equippedFrame = f.id;
    saveState();
    render();
  }

  // ---------- Friends ----------
  function copyInvite() {
    const text = BOT_LINK;
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(text).then(() => showToast('Ссылка скопирована')).catch(() => showToast('Не удалось скопировать'));
    } else {
      showToast('Ссылка: ' + text);
    }
    if (tg && tg.HapticFeedback) tg.HapticFeedback.impactOccurred('light');
  }

  // ---------- Profile ----------
  function resetProgress() {
    state.balance = STARTING_BALANCE;
    state.lastBonus = 0;
    state.ownedFrames = ['none'];
    state.equippedFrame = 'none';
    state.claimedQuests = [];
    state.stats = { totalSpins: 0, totalWins: 0, maxBalance: STARTING_BALANCE, gamesPlayed: { slots: false, dice: false, coin: false, rocket: false }, joined: Date.now() };
    saveState();
    showToast('Прогресс сброшен');
    render();
  }

  // ---------- Race countdown ----------
  function msUntilMidnight() {
    const now = new Date();
    const next = new Date(now.getFullYear(), now.getMonth(), now.getDate() + 1, 0, 0, 0);
    return next - now;
  }
  function formatCountdown(ms) {
    const h = Math.floor(ms / 3600000);
    const m = Math.floor((ms % 3600000) / 60000);
    const s = Math.floor((ms % 60000) / 1000);
    return `${String(h).padStart(2,'0')}:${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`;
  }

        const done = state.claimedQuests.includes(q.id);
        const ready = !done && prog >= q.target;
        const pct = Math.min(100, Math.round((prog / q.target) * 100));
        let btn;
        if (done) btn = `<button class="quest-btn done" disabled>Готово</button>`;
        else if (ready) btn = `<button class="quest-btn claim" data-quest="${q.id}">+${q.reward}</button>`;
        else btn = `<button class="quest-btn locked" disabled>${prog}/${q.target}</button>`;
        return `
          <div class="quest-card">
            <div class="q-icon">${q.icon}</div>
            <div class="q-body">
              <div class="q-title">${q.title}</div>
              <div class="q-desc">${q.desc}</div>
              <div class="q-bar-track"><div class="q-bar-fill" style="width:${pct}%;"></div></div>
            </div>
            ${btn}

        `;
      }).join('')}
    `;

        <div class="stat-card"><div class="val">${fmt(state.balance)}</div><div class="lbl">Баланс</div></div>
        <div class="stat-card"><div class="val">${s.totalSpins}</div><div class="lbl">Ставок сделано</div></div>
        <div class="stat-card"><div class="val">${s.totalWins}</div><div class="lbl">Побед</div></div>
        <div class="stat-card"><div class="val">${fmt(s.maxBalance)}</div><div class="lbl">Рекорд баланса</div></div>
      </div>
      <button class="reset-btn" id="reset-btn">Сбросить прогресс</button>
    `;
  }

  function renderScrollContent() {
    if (state.navTab === 'games') {
      if (state.screen.startsWith('game:')) return renderGameScreen(state.screen.split(':')[1]);
      return renderGamesHome();
    }
    if (state.navTab === 'friends') return renderFriends();
    if (state.navTab === 'quests') return renderQuests();
    if (state.navTab === 'shop') return renderShop();
    return renderProfile();
  }

  function render() {
    root.innerHTML = `
      <div class="toast"></div>
      ${renderTopbar()}
      <div class="scroll">${renderScrollContent()}</div>
      <div class="tabbar">
        <button class="tab ${state.navTab === 'games' ? 'active' : ''}" data-tab="games"><span class="icon">🎮</span>Игры</button>
        <button class="tab ${state.navTab === 'friends' ? 'active' : ''}" data-tab="friends"><span class="icon">👥</span>Друзья</button>
        <button class="tab ${state.navTab === 'quests' ? 'active' : ''}" data-tab="quests"><span class="icon">🎁</span>Задания</button>
        <button class="tab ${state.navTab === 'shop' ? 'active' : ''}" data-tab="shop"><span class="icon">🛍️</span>Магазин</button>
        <button class="tab ${state.navTab === 'profile' ? 'active' : ''}" data-tab="profile"><span class="icon">👤</span>Профиль</button>
      </div>
    `;
    attachHandlers();
  }

  let raceTimerInterval = null;
  function startRaceTimer() {
    if (raceTimerInterval) clearInterval(raceTimerInterval);
    raceTimerInterval = setInterval(() => {
      const el = root.querySelector('#race-timer');
      if (el) el.textContent = formatCountdown(msUntilMidnight());
    }, 1000);
  }

  function attachHandlers() {
    root.querySelectorAll('.tab').forEach(t => t.addEventListener('click', () => goNav(t.dataset.tab)));

    const bonusBtn = root.querySelector('#bonus-btn');
    if (bonusBtn) bonusBtn.addEventListener('click', claimBonus);

    root.querySelectorAll('.game-card[data-game]').forEach(c => {
      c.addEventListener('click', () => openGame(c.dataset.game));
    });

    const backBtn = root.querySelector('#back-btn');
    if (backBtn) backBtn.addEventListener('click', closeGame);

    const betMinus = root.querySelector('#bet-minus');
    const betPlus = root.querySelector('#bet-plus');
    if (betMinus) betMinus.addEventListener('click', () => adjustBet(-10));
    if (betPlus) betPlus.addEventListener('click', () => adjustBet(10));

    root.querySelectorAll('[data-pick]').forEach(btn => {
      btn.addEventListener('click', () => {
        if (state.busy) return;
        const gname = state.screen.split(':')[1];
        if (gname === 'dice') dicePick = btn.dataset.pick;
        if (gname === 'coin') coinPick = btn.dataset.pick;
        render();
      });
    });

    const actionBtn = root.querySelector('#action-btn');
    if (actionBtn) {
      actionBtn.addEventListener('click', () => {
        const gname = state.screen.split(':')[1];
        if (gname === 'slots') spinSlots();
        if (gname === 'dice') rollDice();
        if (gname === 'coin') flipCoin();
      });
    }

    root.querySelectorAll('[data-quest]').forEach(btn => {
      btn.addEventListener('click', () => {
        const q = QUESTS.find(x => x.id === btn.dataset.quest);
        if (q) claimQuest(q);
      });
    });

    root.querySelectorAll('[data-frame]').forEach(btn => {
      btn.addEventListener('click', () => {
        const f = frameById(btn.dataset.frame);
        buyFrame(f);
      });
    });

    const inviteBtn = root.querySelector('#invite-btn');
    if (inviteBtn) inviteBtn.addEventListener('click', copyInvite);

    const resetBtn = root.querySelector('#reset-btn');
    if (resetBtn) resetBtn.addEventListener('click', resetProgress);

    if (state.navTab === 'games' && state.screen === 'home') startRaceTimer();
    else if (raceTimerInterval) { clearInterval(raceTimerInterval); raceTimerInterval = null; }
  }

  async function init() {
    root.innerHTML = '<div class="loading-screen">Тасуем колоду…</div>';
    syncViewportHeight();
    syncSafeArea();
    await loadState();
    render();
    syncViewportHeight();
    syncSafeArea();
  }

  init();
})();
</script>
</body>
</html>
